name: Bug
description: Report a problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      render: text
